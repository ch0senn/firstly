<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Landing Page</title>
  <meta name="viewport" content="width=1000, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff;
    }
    /* Header Banner */
    .header-banner {
      width: 100%;
      height: 400px;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
    }
    .google-btn {
      margin: 32px;
      padding: 12px 24px;
      background: #fff;
      color: #444;
      font-weight: 600;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #eee;
      box-shadow: 0 2px 4px #0001;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .google-btn:hover {
      background: #f3f3f3;
    }
    .google-btn img {
      width: 20px;
      height: 20px;
    }
    /* Four Image Buttons */
    .button-row {
      width: 80%;
      margin: 40px auto 0 auto;
      display: flex;
      justify-content: space-between;
    }
    .image-btn {
      width: 120px;
      height: 120px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 1px 4px #0002;
      background: center/cover no-repeat;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s;
    }
    .image-btn:active {
      transform: scale(0.96);
    }
    /* Hero Section */
    .hero-section {
      width: 90%;
      height: 600px;
      margin: 48px auto 0 auto;
      background: #f8fafc;
      border-radius: 18px;
      box-shadow: 0 8px 20px #0001;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero-row {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 48px;
    }
    .hero-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero-image-btn {
      width: 180px;
      height: 180px;
      border: none;
      border-radius: 16px;
      margin-bottom: 16px;
      background: center/cover no-repeat;
      box-shadow: 0 2px 8px #0001;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .hero-image-btn:active {
      transform: scale(0.97);
    }
    .hero-textarea {
      width: 180px;
      min-height: 50px;
      font-size: 16px;
      padding: 8px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #ddd;
      resize: vertical;
    }
    @media (max-width: 1100px) {
      .button-row {
        width: 98%;
        gap: 12px;
      }
      .hero-section {
        width: 98%;
      }
      .hero-row {
        gap: 24px;
      }
      .image-btn, .hero-image-btn {
        width: 90px;
        height: 90px;
      }
    }
    @media (max-width: 700px) {
      .button-row { flex-direction: column; align-items: center; gap: 20px; }
      .hero-row { flex-direction: column; align-items: center; gap: 32px; }
      .hero-section { height: auto; padding: 30px 0;}
    }
  </style>
</head>
<body>
  <!-- Header Banner -->
  <div class="header-banner">
    <button class="google-btn" id="google-login">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google"/>
      Google Login / Register
    </button>
  </div>
  <!-- Four Image Buttons Row -->
  <div class="button-row">
    <button class="image-btn" style="background-image: url('https://placehold.co/120x120?text=Btn1')" aria-label="Button 1" onclick="alert('Button 1 clicked')"></button>
    <button class="image-btn" style="background-image: url('https://placehold.co/120x120?text=Btn2')" aria-label="Button 2" onclick="alert('Button 2 clicked')"></button>
    <button class="image-btn" style="background-image: url('https://placehold.co/120x120?text=Btn3')" aria-label="Button 3" onclick="alert('Button 3 clicked')"></button>
    <button class="image-btn" style="background-image: url('https://placehold.co/120x120?text=Btn4')" aria-label="Button 4" onclick="alert('Button 4 clicked')"></button>
  </div>
  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-row">
      <div class="hero-block">
        <button class="hero-image-btn" style="background-image: url('https://placehold.co/180x180?text=Hero1')" aria-label="Hero button 1" onclick="alert('Hero Button 1 clicked')"></button>
        <textarea class="hero-textarea" id="hero-text-1">Edit me 1</textarea>
      </div>
      <div class="hero-block">
        <button class="hero-image-btn" style="background-image: url('https://placehold.co/180x180?text=Hero2')" aria-label="Hero button 2" onclick="alert('Hero Button 2 clicked')"></button>
        <textarea class="hero-textarea" id="hero-text-2">Edit me 2</textarea>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('google-login').addEventListener('click', function () {
      // Replace this with Google Sign-In logic as needed
      alert('Google Login clicked!');
    });
    // If you want, you can add code here to handle the hero text state as needed
    // (Or submit, save, etc. as per your requirements)
  </script>
</body>
</html>
